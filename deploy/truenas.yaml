# TrueNAS SCALE: Apps -> Discover Apps -> (⋮) Install via YAML, name it "discord-bots", paste this.
# Change /mnt/tank/apps/discord-bots to the dataset folder that holds your <bot>.env files.
name: discord-bots

x-bot: &bot
  image: ghcr.io/gwystylain/discord-bots:latest
  pull_policy: always # every redeploy picks up the newest build from GitHub
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  ski-brief:
    <<: *bot
    command: ["python", "-m", "bots.ski_brief"]
    env_file: /mnt/tank/apps/discord-bots/ski-brief.env

  # Add the next bot like this (one service per bot, same image):
